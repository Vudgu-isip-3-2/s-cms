<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации - ValidationLibrary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #5C5B4A;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .form-card {
            background: #D6D2C4;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid #8A897C;
        }

        h1 {
            color: #3D3B30;
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 600;
        }

        .subtitle {
            color: #5C5B4A;
            margin-bottom: 30px;
            font-size: 14px;
            border-bottom: 2px solid #8A897C;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #3D3B30;
            font-weight: 600;
            font-size: 14px;
        }

        label .required {
            color: #8B3A3A;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #8A897C;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
            background: #F0EDE5;
        }

        input:focus {
            outline: none;
            border-color: #4A4A3C;
            background: white;
        }

        input.error {
            border-color: #8B3A3A;
            background: #FDE8E8;
        }

        input.success {
            border-color: #2E5C3E;
            background: #E8F0EC;
        }

        .error-message {
            color: #8B3A3A;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4A4A3C;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #3D3B30;
        }

        button:active {
            transform: scale(0.98);
        }

        .error-summary {
            background: #FDE8E8;
            border-left: 4px solid #8B3A3A;
            padding: 15px;
            margin-bottom: 20px;
        }

        .error-summary p {
            color: #8B3A3A;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-summary ul {
            margin-left: 20px;
            color: #6B2D2D;
        }

        .error-summary li {
            margin: 5px 0;
        }

        .success-summary {
            background: #E8F0EC;
            border-left: 4px solid #2E5C3E;
            padding: 15px;
            margin-bottom: 20px;
            color: #2E5C3E;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .age-hint {
            font-size: 12px;
            color: #5C5B4A;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Регистрация</h1>
            <p class="subtitle">Создайте аккаунт, заполнив форму ниже</p>

            <div id="errorSummary" class="error-summary hidden"></div>
            <div id="successSummary" class="success-summary hidden">
                ✅ Форма успешно отправлена!
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="name">Имя <span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="Введите ваше имя">
                    <span class="error-message" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Электронная почта <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="ivan@example.com">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 999 123-45-67">
                    <span class="error-message" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="age">Возраст <span class="required">*</span></label>
                    <input type="number" id="age" name="age" placeholder="18">
                    <span class="error-message" id="ageError"></span>
                    <div class="age-hint">Минимальный возраст: 18 лет</div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль <span class="required">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Минимум 6 символов">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Подтверждение пароля <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль">
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script>
        // Класс ValidationLibrary (ваш код библиотеки)
        class ValidationLibrary {
            constructor(options = {}) {
                this.messages = {
                    required: options.requiredMessage || 'Это поле обязательно для заполнения',
                    email: options.emailMessage || 'Введите корректный email адрес',
                    min: options.minMessage || 'Значение должно быть не меньше {min}',
                    max: options.maxMessage || 'Значение должно быть не больше {max}',
                    minLength: options.minLengthMessage || 'Минимальная длина {minLength} символов',
                    maxLength: options.maxLengthMessage || 'Максимальная длина {maxLength} символов',
                    passwordMatch: options.passwordMatchMessage || 'Пароли не совпадают',
                    phone: options.phoneMessage || 'Введите корректный номер телефона'
                };
            }

            required(value) {
                if (value === undefined || value === null || value === '') {
                    return this.messages.required;
                }
                return null;
            }

            email(value) {
                if (!value) return null;
                
                const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!emailRegex.test(value)) {
                    return this.messages.email;
                }
                return null;
            }

            phone(value) {
                if (!value) return null;
                
                const cleanPhone = value.replace(/[\s\-\(\)]/g, '');
                const phoneRegex = /^(\+7|7|8)?[0-9]{10}$/;
                
                if (!phoneRegex.test(cleanPhone)) {
                    return this.messages.phone;
                }
                return null;
            }

            min(value, minValue) {
                if (value === undefined || value === null) return null;
                
                if (typeof value === 'number' && value < minValue) {
                    return this.messages.min.replace('{min}', minValue);
                }
                return null;
            }

            max(value, maxValue) {
                if (value === undefined || value === null) return null;
                
                if (typeof value === 'number' && value > maxValue) {
                    return this.messages.max.replace('{max}', maxValue);
                }
                return null;
            }

            minLength(value, length) {
                if (!value) return null;
                
                if (value.length < length) {
                    return this.messages.minLength.replace('{minLength}', length);
                }
                return null;
            }

            maxLength(value, length) {
                if (!value) return null;
                
                if (value.length > length) {
                    return this.messages.maxLength.replace('{maxLength}', length);
                }
                return null;
            }

            passwordMatch(password, confirmPassword) {
                if (password !== confirmPassword) {
                    return this.messages.passwordMatch;
                }
                return null;
            }

            number(value) {
                if (!value) return null;
                
                if (isNaN(value) || typeof value === 'boolean') {
                    return 'Введите число';
                }
                return null;
            }

            integer(value) {
                if (!value) return null;
                
                if (!Number.isInteger(Number(value))) {
                    return 'Введите целое число';
                }
                return null;
            }

            validateField(value, rules) {
                const errors = [];
                
                for (const rule of rules) {
                    let error = null;
                    
                    if (rule.name === 'required') {
                        error = this.required(value);
                    } else if (rule.name === 'email') {
                        error = this.email(value);
                    } else if (rule.name === 'phone') {
                        error = this.phone(value);
                    } else if (rule.name === 'min') {
                        error = this.min(value, rule.params);
                    } else if (rule.name === 'max') {
                        error = this.max(value, rule.params);
                    } else if (rule.name === 'minLength') {
                        error = this.minLength(value, rule.params);
                    } else if (rule.name === 'maxLength') {
                        error = this.maxLength(value, rule.params);
                    } else if (rule.name === 'number') {
                        error = this.number(value);
                    } else if (rule.name === 'integer') {
                        error = this.integer(value);
                    }
                    
                    if (error) {
                        errors.push(error);
                    }
                }
                
                return {
                    isValid: errors.length === 0,
                    errors: errors
                };
            }

            validateForm(data, schema) {
                const results = {};
                let isValid = true;
                
                for (const [fieldName, rules] of Object.entries(schema)) {
                    const value = data[fieldName];
                    const result = this.validateField(value, rules);
                    
                    results[fieldName] = result;
                    
                    if (!result.isValid) {
                        isValid = false;
                    }
                }
                
                return {
                    isValid: isValid,
                    results: results
                };
            }

            getErrorsList(validationResult) {
                const errors = [];
                
                for (const [field, result] of Object.entries(validationResult.results)) {
                    if (!result.isValid) {
                        result.errors.forEach(error => {
                            errors.push({
                                field: field,
                                message: error
                            });
                        });
                    }
                }
                
                return errors;
            }

            getFirstError(validationResult) {
                const errors = this.getErrorsList(validationResult);
                return errors.length > 0 ? errors[0].message : null;
            }

            hasErrors(validationResult) {
                return !validationResult.isValid;
            }

            setMessages(customMessages) {
                this.messages = { ...this.messages, ...customMessages };
                return this;
            }
        }

        // Инициализация валидатора с русскими сообщениями
        const validator = new ValidationLibrary({
            requiredMessage: '⚠️ Поле обязательно для заполнения',
            emailMessage: '⚠️ Введите корректный адрес электронной почты',
            minLengthMessage: '⚠️ Минимальная длина {minLength} символов',
            maxLengthMessage: '⚠️ Максимальная длина {maxLength} символов',
            passwordMatchMessage: '⚠️ Пароли не совпадают',
            phoneMessage: '⚠️ Введите корректный номер телефона (например, +7 999 123-45-67)',
            minMessage: '⚠️ Значение должно быть не меньше {min}',
            maxMessage: '⚠️ Значение должно быть не больше {max}'
        });

        // Схема валидации для формы
        const validationSchema = {
            name: [
                { name: 'required' },
                { name: 'minLength', params: 2 },
                { name: 'maxLength', params: 50 }
            ],
            email: [
                { name: 'required' },
                { name: 'email' }
            ],
            phone: [
                { name: 'phone' }
            ],
            age: [
                { name: 'required' },
                { name: 'number' },
                { name: 'integer' },
                { name: 'min', params: 18 },
                { name: 'max', params: 120 }
            ],
            password: [
                { name: 'required' },
                { name: 'minLength', params: 6 }
            ]
        };

        // Функция для отображения ошибок
        function displayErrors(validationResult, formData) {
            const errorFields = ['name', 'email', 'phone', 'age', 'password', 'confirmPassword'];
            errorFields.forEach(field => {
                const input = document.getElementById(field);
                const errorSpan = document.getElementById(field + 'Error');
                if (input) input.classList.remove('error', 'success');
                if (errorSpan) errorSpan.textContent = '';
            });

            for (const [field, result] of Object.entries(validationResult.results)) {
                const input = document.getElementById(field);
                const errorSpan = document.getElementById(field + 'Error');
                
                if (input && errorSpan) {
                    if (!result.isValid) {
                        input.classList.add('error');
                        errorSpan.textContent = result.errors[0];
                    } else if (formData[field] && formData[field] !== '') {
                        input.classList.add('success');
                    }
                }
            }

            const password = formData.password;
            const confirmPassword = formData.confirmPassword;
            const confirmError = validator.passwordMatch(password, confirmPassword);
            const confirmInput = document.getElementById('confirmPassword');
            const confirmErrorSpan = document.getElementById('confirmPasswordError');
            
            if (confirmError && confirmPassword) {
                confirmInput.classList.add('error');
                confirmErrorSpan.textContent = confirmError;
                validationResult.isValid = false;
            } else if (confirmPassword && !confirmError) {
                confirmInput.classList.add('success');
            }

            const errorSummary = document.getElementById('errorSummary');
            const successSummary = document.getElementById('successSummary');
            
            if (!validationResult.isValid) {
                const errorsList = validator.getErrorsList(validationResult);
                
                if (confirmError) {
                    errorsList.push({ field: 'confirmPassword', message: confirmError });
                }
                
                if (errorsList.length > 0) {
                    errorSummary.innerHTML = `
                        <p>❌ Пожалуйста, исправьте следующие ошибки:</p>
                        <ul>
                            ${errorsList.map(err => {
                                let fieldName = err.field;
                                if (fieldName === 'confirmPassword') fieldName = 'подтверждение пароля';
                                if (fieldName === 'email') fieldName = 'электронная почта';
                                if (fieldName === 'phone') fieldName = 'телефон';
                                if (fieldName === 'age') fieldName = 'возраст';
                                if (fieldName === 'name') fieldName = 'имя';
                                return `<li>${fieldName}: ${err.message}</li>`;
                            }).join('')}
                        </ul>
                    `;
                    errorSummary.classList.remove('hidden');
                }
                successSummary.classList.add('hidden');
            } else {
                errorSummary.classList.add('hidden');
            }
        }

        // Обработчик отправки формы
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                age: parseInt(document.getElementById('age').value),
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };
            
            const validationResult = validator.validateForm(formData, validationSchema);
            displayErrors(validationResult, formData);
            
            if (validationResult.isValid && !validator.passwordMatch(formData.password, formData.confirmPassword)) {
                const successSummary = document.getElementById('successSummary');
                const errorSummary = document.getElementById('errorSummary');
                successSummary.classList.remove('hidden');
                errorSummary.classList.add('hidden');
                
                console.log('Форма валидна! Данные:', formData);
                
                setTimeout(() => {
                    alert('✅ Форма успешно отправлена!\n\n' + 
                          `Имя: ${formData.name}\n` +
                          `Email: ${formData.email}\n` +
                          `Телефон: ${formData.phone || 'не указан'}\n` +
                          `Возраст: ${formData.age}`);
                }, 100);
                
                setTimeout(() => {
                    successSummary.classList.add('hidden');
                }, 3000);
            }
        });
        
        // Валидация в реальном времени
        const fields = ['name', 'email', 'phone', 'age', 'password'];
        fields.forEach(field => {
            const input = document.getElementById(field);
            if (input) {
                input.addEventListener('input', (e) => {
                    const rules = validationSchema[field];
                    if (rules) {
                        const result = validator.validateField(e.target.value, rules);
                        const errorSpan = document.getElementById(field + 'Error');
                        
                        if (!result.isValid && e.target.value !== '') {
                            e.target.classList.add('error');
                            e.target.classList.remove('success');
                            errorSpan.textContent = result.errors[0];
                        } else if (result.isValid && e.target.value !== '') {
                            e.target.classList.remove('error');
                            e.target.classList.add('success');
                            errorSpan.textContent = '';
                        } else if (e.target.value === '') {
                            e.target.classList.remove('error', 'success');
                            errorSpan.textContent = '';
                        }
                    }
                    
                    if (field === 'password') {
                        const confirmInput = document.getElementById('confirmPassword');
                        if (confirmInput.value) {
                            const confirmError = validator.passwordMatch(e.target.value, confirmInput.value);
                            const confirmErrorSpan = document.getElementById('confirmPasswordError');
                            if (confirmError) {
                                confirmInput.classList.add('error');
                                confirmErrorSpan.textContent = confirmError;
                            } else {
                                confirmInput.classList.remove('error');
                                confirmInput.classList.add('success');
                                confirmErrorSpan.textContent = '';
                            }
                        }
                    }
                });
            }
        });
        
        document.getElementById('confirmPassword').addEventListener('input', (e) => {
            const password = document.getElementById('password').value;
            const confirmError = validator.passwordMatch(password, e.target.value);
            const confirmErrorSpan = document.getElementById('confirmPasswordError');
            
            if (confirmError && e.target.value) {
                e.target.classList.add('error');
                e.target.classList.remove('success');
                confirmErrorSpan.textContent = confirmError;
            } else if (e.target.value && !confirmError) {
                e.target.classList.remove('error');
                e.target.classList.add('success');
                confirmErrorSpan.textContent = '';
            } else if (!e.target.value) {
                e.target.classList.remove('error', 'success');
                confirmErrorSpan.textContent = '';
            }
        });
    </script>
</body>
</html>
