<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка медиафайлов</title>
</head>
<body>
    <h2>Загрузка медиафайлов</h2>
    <p>Загрузите изображения, видео или аудио файлы</p>

    <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
        <!-- Область загрузки файлов -->
        <div>
            <input type="file" id="fileInput" name="files[]" multiple accept="image/*,video/*,audio/*">
            <small>Поддерживаются JPG, PNG, GIF, MP4, MP3, WAV</small>
        </div>

        <!-- Список выбранных файлов -->
        <div id="fileList"></div>

        <!-- Дополнительные поля -->
        <div>
            <label for="description">Описание:</label>
            <input type="text" id="description" name="description" placeholder="Введите описание файлов">
        </div>
        <!--  Индикатор прогресса
        <div id="progressContainer" style="display: none;">
            <div>Прогресс загрузки:</div>
            <progress id="progressBar" value="0" max="100"></progress>
            <span id="progressText">0%</span>
        </div> -->

        <!-- Кнопки управления -->
        <div>
            <button type="submit" id="submitBtn">Загрузить</button>
            <button type="reset" id="resetBtn">Очистить</button>
        </div>
    </form>

    <!-- Сообщения для пользователя -->
    <div id="message"></div>
