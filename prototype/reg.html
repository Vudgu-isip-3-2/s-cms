<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error-message { color: red; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<h2>Регистрация</h2>

<form id="regForm">
    <div class="form-group">
        <label for="login">Логин:</label>
        <!-- Атрибут required не даст отправить форму, если поле пустое -->
        <input type="text" id="login" name="login" required>
    </div>

    <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="form-group">
        <label for="confirmPassword">Подтверждение пароля:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
    </div>

    <button type="submit">Зарегистрироваться</button>
</form>

<!-- Блок для вывода сообщения об ошибке -->
<p id="errorMessage" class="error-message"></p>

<script>
    // Находим форму и блок для ошибок
    const form = document.getElementById("regForm");
    const errorText = document.getElementById("errorMessage");

    // Слушаем событие отправки формы
    form.addEventListener("submit", function(event) {
        // Получаем значения полей
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // Простая проверка: совпадают ли пароли
        if (password !== confirmPassword) {

            event.preventDefault(); 

            errorText.textContent = "Ошибка: Пароли не совпадают!";
            errorText.style.display = "block";
        } else {

            errorText.style.display = "none";

        }
    });
</script>

</body>
</html>
