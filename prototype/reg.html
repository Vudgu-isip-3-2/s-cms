<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> <!-- кодировка -->
    <title>Регистрация</title>
</head>

<body> 

<h2>Регистрация</h2> 

<form id="form"> <!-- форма -->

    <div>
        <label>Логин:</label><br>
        <input type="text" id="login"> <!-- ввод логина -->
    </div>

    <div>
        <label>Пароль:</label><br>
        <input type="password" id="password"> <!-- ввод пароля -->
    </div>

    <div>
        <label>Подтвердите пароль:</label><br>
        <input type="password" id="confirmPassword"> <!-- повтор пароля -->
    </div>

    <div id="errors"></div> <!-- сюда выводятся ошибки -->

    <button type="submit">Зарегистрироваться</button>

</form>

<script>

// класс для валидации
class ValidationLibrary {
    constructor(options = {}) {
        this.messages = {
            required: options.requiredMessage || 'Это поле обязательно для заполнения',
            passwordMatch: options.passwordMatchMessage || 'Пароли не совпадают'
        };
    }

    required(value) { // проверка на пустоту
        if (!value) return this.messages.required;
        return null;
    }

    passwordMatch(p1, p2) { // проверка совпадения паролей
        if (p1 !== p2) return this.messages.passwordMatch;
        return null;
    }

    validateForm(data, schema) { // проверка всей формы
        const results = {};
        let isValid = true;

        for (const field in schema) {
            const value = data[field];
            const rules = schema[field];
            const errors = [];

            rules.forEach(rule => {
                if (rule.name === 'required') {
                    const err = this.required(value);
                    if (err) errors.push(err);
                }
            });

            if (errors.length > 0) isValid = false;

            results[field] = {
                isValid: errors.length === 0,
                errors: errors
            };
        }

        return { isValid, results }; // результат проверки
    }

    getErrorsList(result) { // получить список ошибок
        const list = [];

        for (const field in result.results) {
            result.results[field].errors.forEach(err => {
                list.push({ field, message: err });
            });
        }

        return list;
    }

    hasErrors(result) { // есть ли ошибки
        return !result.isValid;
    }
}

// получаем элементы
const form = document.getElementById('form');
const errorsDiv = document.getElementById('errors');

// создаём валидатор
const validator = new ValidationLibrary({
    requiredMessage: 'Поле должно быть заполнено',
    passwordMatchMessage: 'Пароли не совпадают'
});

// обработка отправки формы
form.addEventListener('submit', function(e) {
    e.preventDefault(); // отмена отправки

    // собираем данные
    const data = {
        login: document.getElementById('login').value,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value
    };

    // правила проверки
    const schema = {
        login: [{ name: 'required' }],
        password: [{ name: 'required' }],
        confirmPassword: [{ name: 'required' }]
    };

    const result = validator.validateForm(data, schema); // проверка

    // проверка совпадения паролей
    const passError = validator.passwordMatch(data.password, data.confirmPassword);
    if (passError) {
        result.isValid = false;
        result.results.confirmPassword.errors.push(passError);
    }

    errorsDiv.innerHTML = ''; // очистка ошибок

    // если есть ошибки — выводим
    if (validator.hasErrors(result)) {
        const errors = validator.getErrorsList(result);

        errors.forEach(err => {
            const p = document.createElement('p');
            p.textContent = err.field + ': ' + err.message;
            errorsDiv.appendChild(p);
        });
    } else {
        alert('Успешно!'); // если всё круто
    }
});

</script>

</body>
</html>
