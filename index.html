<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Page Sorter Example</title>
  <style>
    #page-list { list-style: none; padding: 0; width: 200px; }
    #page-list li { padding: 8px; margin: 4px 0; background: #eee; cursor: grab; }
    #page-list li:active { cursor: grabbing; }
  </style>
</head>
<body>

<h2>Список страниц</h2>
<ul id="page-list">
  <li data-id="1">Главная</li>
  <li data-id="2">О нас</li>
  <li data-id="3">Наш блог</li>
  <li data-id="4">Контакты</li>
</ul>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="PageSorter.js"></script>
<script>
  const sorter = new PageSorter({
    listSelector: '#page-list',
    saveUrl: null, // тут можно указать URL для сервер
    useLocalStorage: true
  });

  // Пример: вывести порядок в консоль
  console.log('Текущий порядок:', sorter.getOrder());
</script>

</body>
</html>
